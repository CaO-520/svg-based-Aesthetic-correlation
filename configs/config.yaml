sampling:
  total_samples: 900
  human_design: 300
  degraded: 300
  model_generated: 300
  random_seed: 20020306

rendering:
  output_width: 512
  output_height: 512
  background_color: "white"
  preserve_aspect_ratio: true
  skip_invalid_svg: true

degradation:
  methods: [rotate, shift, scale, path_noise, color_noise, element_drop]
  parameters:
    rotate_deg: [-12, 12]
    shift_px: [-10, 10]
    scale_factor: [0.90, 1.10]
    path_noise_std: [0.4, 1.6]
    path_noise_type: "gaussian"
    color_noise_std: [0.03, 0.10]
    element_drop_rate: [0.03, 0.12]
  random_seed: 2002

model_generation:
  aihubmix:
    qwen_model_id: "qwen3-vl-30b-a3b-thinking"
    api_key: "YOUR_API_KEY_HERE"
    base_url: "https://aihubmix.com/v1"
  aliyuncs:
    qwen_model_id: "qwen3-vl-plus"
    api_key: "YOUR_API_KEY_HERE"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

model_prompt:
  qwen_svg_generation:
    template: |
      你是一个 SVG 生成助手。根据给定的输入图片，生成符合要求的 SVG 矢量图。要求：
      1. 保留主体形状和结构。
      2. 色彩简洁，尽量与输入协调。
      3. 输出纯 SVG 代码，不包含说明文字或 Markdown。
      4. 避免过多装饰元素，保持可读性。

