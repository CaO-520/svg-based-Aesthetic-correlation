<svg width="300" height="50" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="10" width="300" height="20" rx="10" fill="none" stroke="black" />
  <rect x="0" y="10" width="100" height="20" rx="10" fill="#FFC0CB" />
  <line x1="50" y1="30" x2="50" y2="40" stroke="black" stroke-dasharray="3,3" />
  <line x1="150" y1="30" x2="150" y2="40" stroke="black" stroke-dasharray="3,3" />
  <line x1="250" y1="30" x2="250" y2="40" stroke="black" stroke-dasharray="3,3" />
  <text x="50" y="40" text-anchor="middle" font-size="12">recibido</text>
  <text x="150" y="40" text-anchor="middle" font-size="12">enviado</text>
  <text x="250" y="40" text-anchor="middle" font-size="12">entregado</text>
</svg>